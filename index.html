<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📐</text></svg>">    <title>CAD para Moldes de Corte e Costura - v4.4</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f2f5;
            overflow: hidden;
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .main-header {
            background: white;
            padding: 4px 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            z-index: 20;
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .app-brand {
            font-weight: 700;
            color: #007bff;
            font-size: 13px;
            margin-right: 8px;
            flex-shrink: 0;
            position: absolute;
            left: 8px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 1;
        }

        .header-section {
            display: flex;
            align-items: center;
            gap: 2px;
            padding: 2px 6px;
            border-right: 1px solid #e0e0e0;
            cursor: grab;
            -webkit-user-select: none;
            user-select: none;
        }
        .header-section:active {
            cursor: grabbing;
        }
        .header-section:last-child {
            border-right: none;
        }
        .header-section.dragging {
            opacity: 0.5;
            background: #f0f4ff;
            border-radius: 6px;
        }
        .header-section.drag-over {
            background: #e7f1ff;
            border-radius: 6px;
            border-right: 2px dashed #007bff;
        }

        .hidden-file-input {
            display: none;
        }

        .body-content {
            display: flex;
            flex: 1;
            min-height: 0;
        }

        .sidebar {
            width: 200px;
            min-width: 200px;
            background: white;
            padding: 10px;
            box-shadow: 2px 0 5px rgba(0, 0, 0, 0.1);
            overflow-y: auto;
            overflow-x: hidden;
            z-index: 10;
            flex-shrink: 0;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .canvas-container {
            flex: 1;
            background: #e8e8e8;
            position: relative;
            overflow: hidden;
            cursor: default;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
        }

        .selection-marquee {
            position: absolute;
            border: 2px dashed #0066ff;
            background: rgba(0, 102, 255, 0.1);
            pointer-events: none;
            display: none;
            z-index: 100;
        }

        .snap-dot {
            position: absolute;
            width: 10px;
            height: 10px;
            background: #ff00ff;
            border-radius: 50%;
            border: 2px solid white;
            pointer-events: none;
            z-index: 201;
            display: none;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 6px rgba(255, 0, 255, 0.6);
            animation: snapPulse 0.3s ease 1;
            transition: all 0.05s ease;
        }

        .point-tooltip {
            position: absolute;
            display: none;
            z-index: 202;
            pointer-events: none;
            transform: translate(-50%, -100%);
            margin-top: -8px;
            background: rgba(17, 24, 39, 0.95);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 6px;
            padding: 4px 7px;
            font-size: 10px;
            line-height: 1.2;
            white-space: nowrap;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.22);
        }
        .point-tooltip .pt-title {
            font-weight: 700;
            letter-spacing: 0.2px;
        }
        .point-tooltip .pt-sub {
            opacity: 0.85;
            margin-top: 2px;
        }

        @keyframes snapPulse {
            0% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 1;
            }
            50% {
                transform: translate(-50%, -50%) scale(1.5);
                opacity: 0.5;
            }
            100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 1;
            }
        }

        .context-menu {
            position: fixed;
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
            z-index: 1000;
            display: none;
            min-width: 180px;
            padding: 6px 0;
        }

        .context-menu-item {
            padding: 9px 16px;
            cursor: pointer;
            font-size: 13px;
            transition: background 0.15s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .context-menu-item:hover {
            background: #f0f4ff;
        }
        .context-menu-item.danger {
            color: #dc3545;
        }
        .context-menu-item.danger:hover {
            background: #fff0f0;
        }
        .context-submenu {
            font-size: 10px;
            color: #999;
            padding: 4px 16px 2px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        .btn {
            width: 30px;
            height: 30px;
            padding: 0;
            border: 1px solid #dee2e6;
            border-radius: 5px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.15s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            position: relative;
            flex-shrink: 0;
            background: #f8f9fa;
            color: #333;
            outline: none;
        }
        .btn:hover {
            background: #e9ecef;
            border-color: #007bff;
            z-index: 2;
        }
        .btn:active {
            transform: scale(0.92);
        }
        .btn.active {
            background: #0056b3 !important;
            color: white !important;
            border-color: #0056b3 !important;
        }

        .btn-primary { background: #007bff; color: white; border-color: #007bff; }
        .btn-primary:hover { background: #0056b3; border-color: #0056b3; }
        .btn-secondary { background: #6c757d; color: white; border-color: #6c757d; }
        .btn-secondary:hover { background: #545b62; border-color: #545b62; }
        .btn-success { background: #28a745; color: white; border-color: #28a745; }
        .btn-success:hover { background: #218838; border-color: #218838; }
        .btn-danger { background: #dc3545; color: white; border-color: #dc3545; }
        .btn-danger:hover { background: #c82333; border-color: #c82333; }
        .btn-warning { background: #ffc107; color: #333; border-color: #ffc107; }
        .btn-warning:hover { background: #e0a800; border-color: #e0a800; }
        .btn-info { background: #17a2b8; color: white; border-color: #17a2b8; }
        .btn-info:hover { background: #138496; border-color: #138496; }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 10000;
        }
        .modal-overlay.show {
            display: flex;
        }
        .modal-box {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            width: 380px;
            max-width: 90vw;
            padding: 24px 20px 20px;
            position: relative;
            text-align: center;
            animation: modalPop 0.25s ease;
        }
        @keyframes modalPop {
            from { transform: scale(0.85); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .modal-close {
            position: absolute;
            top: 8px;
            right: 12px;
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: #888;
            line-height: 1;
            padding: 4px;
        }
        .modal-close:hover { color: #dc3545; }
        .modal-icon { font-size: 40px; margin-bottom: 6px; }
        .modal-box h2 {
            font-size: 18px;
            color: #333;
            margin-bottom: 4px;
        }
        .modal-box p {
            font-size: 13px;
            color: #666;
            margin: 4px 0;
        }
        .modal-divider {
            height: 1px;
            background: #eee;
            margin: 12px 0;
        }
        .modal-creator {
            font-size: 15px;
            font-weight: 700;
            color: #007bff;
        }
        .modal-year {
            font-size: 13px;
            color: #555;
        }

        .property-group {
            margin-bottom: 6px;
        }
        .property-group label {
            display: block;
            margin-bottom: 1px;
            font-size: 9px;
            color: #666;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        .property-group input {
            width: 100%;
            padding: 3px 5px;
            border: 1px solid #dee2e6;
            border-radius: 4px;
            font-size: 11px;
        }
        .property-group input:focus {
            outline: none;
            border-color: #007bff;
        }
        .property-group input.editing {
            border-color: #28a745;
            background-color: #f0fff4;
        }
        .property-group input[type="range"] {
            padding: 0;
            height: 4px;
            -webkit-appearance: none;
            appearance: none;
            background: #dee2e6;
            border-radius: 2px;
        }
        .property-group select {
            width: 100%;
            padding: 3px 5px;
            border: 1px solid #dee2e6;
            border-radius: 4px;
            font-size: 11px;
            background: #fff;
            color: #333;
        }
        .property-group select:focus {
            outline: none;
            border-color: #007bff;
        }
        .point-props-panel {
            margin-top: 10px;
            padding-top: 8px;
            border-top: 1px solid #e9ecef;
        }
        .point-props-panel h3 {
            font-size: 11px;
            margin-bottom: 6px;
            color: #333;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }
        .point-edit-card {
            border: 1px solid #e5e7eb;
            border-radius: 6px;
            padding: 6px;
            margin-bottom: 6px;
            background: #fafafa;
        }
        .point-edit-title {
            font-size: 10px;
            font-weight: 700;
            color: #555;
            margin-bottom: 5px;
            text-transform: uppercase;
        }
        .point-edit-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px;
        }
        .point-edit-row .property-group {
            margin-bottom: 0;
        }
        .point-edit-hint {
            font-size: 10px;
            color: #888;
            margin-bottom: 6px;
        }
        .property-group input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #007bff;
            cursor: pointer;
        }
        .snap-threshold-value {
            display: inline-block;
            margin-left: 4px;
            font-weight: bold;
            color: #007bff;
            font-size: 10px;
        }
        .apply-btn {
            width: 100%;
            margin-top: 3px;
            padding: 4px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 10px;
            font-weight: 600;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .apply-btn:hover {
            background: #218838;
            transform: scale(1.02);
        }

        .sidebar-checkboxes {
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid #e0e0e0;
        }
        .sidebar-checkbox-label {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            font-size: 11px;
            color: #555;
            padding: 4px 0;
        }
        .sidebar-checkbox-label input[type="checkbox"] {
            margin: 0;
            width: 14px;
            height: 14px;
        }

        .layers-panel {
            margin-top: 10px;
        }
        .layers-panel h3 {
            margin-bottom: 5px;
            color: #555;
            font-size: 10px;
            border-bottom: 2px solid #007bff;
            padding-bottom: 3px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            text-align: center;
        }
        .layer-item {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 3px 5px;
            background: #f8f9fa;
            margin-bottom: 2px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid transparent;
            font-size: 10px;
        }
        .layer-item:hover { background: #e9ecef; }
        .layer-item.selected { border-color: #007bff; background: #e7f1ff; }
        .layer-color { width: 12px; height: 12px; border: 1px solid #000; border-radius: 2px; flex-shrink: 0; }
        .layer-name { flex: 1; font-size: 9px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .layer-size { font-size: 8px; color: #666; flex-shrink: 0; }
        .layer-toggle { background: none; border: none; cursor: pointer; font-size: 11px; padding: 0; flex-shrink: 0; }

        .status-bar {
            background: #333;
            color: white;
            padding: 4px 12px;
            font-size: 10px;
            z-index: 10;
            display: flex;
            justify-content: space-between;
        }
        .coordinates { color: #aaa; }

        .sidebar h3 {
            margin-bottom: 8px;
            color: #555;
            font-size: 11px;
            border-bottom: 2px solid #007bff;
            padding-bottom: 3px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            text-align: center;
        }

        .sidebar-section {
            margin-bottom: 10px;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            overflow: hidden;
            background: #fff;
        }
        .sidebar-section-header {
            width: 100%;
            border: 0;
            background: linear-gradient(180deg, #f8fafc, #eef2f7);
            color: #444;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            padding: 7px 9px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
        }
        .sidebar-section-header:hover {
            background: linear-gradient(180deg, #f2f6fb, #e8eef6);
        }
        .sidebar-section-header .section-title {
            flex: 1;
            text-align: left;
        }
        .sidebar-section-header .section-arrow {
            font-size: 11px;
            transition: transform 0.2s ease;
            margin-left: 8px;
        }
        .sidebar-section.collapsed .section-arrow {
            transform: rotate(-90deg);
        }
        .sidebar-section-body {
            padding: 8px;
        }
        .sidebar-section.collapsed .sidebar-section-body {
            display: none;
        }
        .sidebar-section .point-props-panel {
            margin-top: 0;
            padding-top: 0;
            border-top: 0;
        }

        .sidebar::-webkit-scrollbar { width: 3px; }
        .sidebar::-webkit-scrollbar-track { background: #f1f1f1; }
        .sidebar::-webkit-scrollbar-thumb { background: #007bff; border-radius: 2px; }

        @media (max-width: 1024px) {
            .btn { width: 26px; height: 26px; font-size: 11px; }
            .sidebar { width: 170px; min-width: 170px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="main-header" id="mainHeader">
            <span class="app-brand">📐 CAD Moldes</span>

            <div class="header-section" draggable="true" data-section="ferramentas">
                <button class="btn btn-primary active" id="toolSelect" onclick="setTool('select')" data-tooltip="Selecionar">👆</button>
                <button class="btn btn-warning" id="toolEditPoints" onclick="setTool('editPoints')" data-tooltip="Editar Pontos">✏️</button>
            </div>

            <div class="header-section" draggable="true" data-section="formas">
                <button class="btn" onclick="addBagPart('body')" data-tooltip="Corpo">🎒</button>
                <button class="btn" onclick="addBagPart('halfmoon')" data-tooltip="Meia-Lua">🌓</button>
            </div>

            <div class="header-section" draggable="true" data-section="acoes">
                <button class="btn btn-info" onclick="copyShape()" data-tooltip="Copiar (Ctrl+C)">📋</button>
                <button class="btn btn-info" onclick="pasteShape()" data-tooltip="Colar (Ctrl+V)">📌</button>
                <button class="btn btn-success" onclick="duplicateSelected()" data-tooltip="Duplicar (Ctrl+D)">📋+</button>
                <button class="btn btn-danger" onclick="deleteSelected()" data-tooltip="Deletar (Delete)">🗑️</button>
                <button class="btn btn-primary" onclick="exportPattern()" data-tooltip="Exportar PNG">💾</button>
                <button class="btn btn-secondary" onclick="clearCanvas()" data-tooltip="Limpar Tudo">🔄</button>
                <button class="btn btn-success" onclick="exportJSON()" data-tooltip="Exportar Projeto (JSON)">📤</button>
                <button class="btn btn-warning" onclick="triggerImportJSON()" data-tooltip="Importar Projeto (JSON)">📥</button>
                <input type="file" id="importJsonFile" class="hidden-file-input" accept=".json" onchange="importJSON(event)">
            </div>

            <div class="header-section" draggable="true" data-section="zoom">
                <button class="btn btn-primary" onclick="zoomIn()" data-tooltip="Zoom +">🔍+</button>
                <button class="btn btn-primary" onclick="zoomOut()" data-tooltip="Zoom -">🔍-</button>
                <button class="btn btn-secondary" onclick="resetZoom()" data-tooltip="Resetar Zoom">↺</button>
                <button class="btn btn-secondary" onclick="fitAll()" data-tooltip="Ajustar Tudo">📐</button>
            </div>

            <div class="header-section" draggable="true" data-section="sobre">
                <button class="btn btn-info" onclick="openAboutModal()" data-tooltip="Sobre">ℹ️</button>
            </div>
        </div>

        <div class="body-content">
            <div class="sidebar">
                <div class="sidebar-section" id="sectionProperties">
                    <button class="sidebar-section-header" type="button" onclick="toggleSidebarSection('sectionProperties')">
                        <span class="section-title">Propriedades</span>
                        <span class="section-arrow">▾</span>
                    </button>
                    <div class="sidebar-section-body">
                        <div class="property-group"><label for="shapeName">Nome</label><input type="text" id="shapeName" placeholder="Nome"></div>
                        <div class="property-group"><label for="width">Largura (cm)</label><input type="number" id="width" value="20" min="0.1" max="200" step="0.1" onchange="updateShapeFromInputs()"></div>
                        <div class="property-group"><label for="height">Altura (cm)</label><input type="number" id="height" value="15" min="0.1" max="200" step="0.1" onchange="updateShapeFromInputs()"></div>
                        <div class="property-group"><label for="posX">Posição X (cm)</label><input type="number" id="posX" value="0" step="0.1" onchange="updateShapeFromInputs()"></div>
                        <div class="property-group"><label for="posY">Posição Y (cm)</label><input type="number" id="posY" value="0" step="0.1" onchange="updateShapeFromInputs()"></div>
                        <div class="property-group"><label for="seamAllowance">Margem (cm)</label><input type="number" id="seamAllowance" value="1" min="0" max="5" step="0.1" onchange="updateShapeFromInputs()"></div>
                        <div class="property-group"><label for="color">Cor</label><input type="color" id="color" value="#4A90E2" onchange="updateShapeFromInputs()"></div>
<div class="property-group"><label for="lineStyle">Tipo de Linha</label><select id="lineStyle" onchange="updateShapeFromInputs()"><option value="solid">Contínua</option><option value="dashed">Tracejada</option><option value="dotted">Pontilhada</option><option value="dashdot">Traço-ponto</option><option value="draft">Rascunho</option><option value="pen">Caneta</option><option value="chalk">Giz</option><option value="marker">Marcador</option></select></div>
                        <div class="property-group">
                            <label for="snapThreshold">Sensibilidade Snap</label>
                            <input type="range" id="snapThreshold" min="5" max="30" value="12" step="1" oninput="updateSnapThreshold(this.value)">
                            <span class="snap-threshold-value" id="snapThresholdValue">12px</span>
                        </div>
                        <button class="apply-btn" onclick="applyPropertiesToShape()">✅ Aplicar</button>
                    </div>
                </div>

                <div class="sidebar-section" id="sectionFineTune">
                    <button class="sidebar-section-header" type="button" onclick="toggleSidebarSection('sectionFineTune')">
                        <span class="section-title">Ajuste fino</span>
                        <span class="section-arrow">▾</span>
                    </button>
                    <div class="sidebar-section-body">
                        <div id="pointPropsPanel" class="point-props-panel"></div>
                    </div>
                </div>

                <div class="sidebar-section" id="sectionOptions">
                    <button class="sidebar-section-header" type="button" onclick="toggleSidebarSection('sectionOptions')">
                        <span class="section-title">Opções</span>
                        <span class="section-arrow">▾</span>
                    </button>
                    <div class="sidebar-section-body">
                        <div class="sidebar-checkboxes">
                            <label class="sidebar-checkbox-label"><input type="checkbox" id="showGrid" checked onchange="toggleGrid()"> Mostrar Grade</label>
                            <label class="sidebar-checkbox-label"><input type="checkbox" id="showSeamAllowance" checked onchange="toggleSeamAllowance()"> Mostrar Margem</label>
                            <label class="sidebar-checkbox-label"><input type="checkbox" id="snapEnabled" checked onchange="toggleSnapEnabled()"> Ativar Snap</label>
                            <label class="sidebar-checkbox-label"><input type="checkbox" id="showDimensions" checked onchange="toggleDimensions()"> Mostrar Cotas</label>
                        </div>
                    </div>
                </div>

                <div class="sidebar-section layers-panel" id="sectionLayers">
                    <button class="sidebar-section-header" type="button" onclick="toggleSidebarSection('sectionLayers')">
                        <span class="section-title">Camadas</span>
                        <span class="section-arrow">▾</span>
                    </button>
                    <div class="sidebar-section-body">
                        <div id="layersList"></div>
                    </div>
                </div>
            </div>

            <div class="main-content">
                <div class="canvas-container" id="canvasContainer">
                    <canvas id="mainCanvas"></canvas>
                    <div class="selection-marquee" id="selectionMarquee"></div>
                    <div class="snap-dot" id="snapDot"></div>
                    <div class="point-tooltip" id="pointTooltip"></div>
                    <div class="context-menu" id="contextMenu"></div>
                </div>
                <div class="status-bar"><span id="statusText">Pronto | Zoom: 100%</span><span class="coordinates" id="coordinates">X: 0 Y: 0</span></div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="aboutModal">
        <div class="modal-box">
            <button class="modal-close" onclick="closeAboutModal()" aria-label="Fechar">&times;</button>
            <div class="modal-icon">📐</div>
            <h2>Sobre o CAD Moldes</h2>
            <div class="modal-divider"></div>
            <p>Faça as considerações ao criador caso use este app</p>
            <p class="modal-creator">Criador: Samuel de Oliveira</p>
            <div class="modal-divider"></div>
            <p class="modal-year">© <span id="aboutYear"></span></p>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('canvasContainer');
        const marquee = document.getElementById('selectionMarquee');
        const snapDot = document.getElementById('snapDot');
        const pointTooltip = document.getElementById('pointTooltip');
        const contextMenu = document.getElementById('contextMenu');

        let currentTool = 'select',
            zoom = 1,
            offsetX = 0,
            offsetY = 0;
        let isDragging = false,
            isPanning = false,
            isResizing = false,
            isMarqueeSelecting = false;
        let resizeHandle = null,
            startX, startY, marqueeStartX, marqueeStartY, lastMouseX, lastMouseY;
        let selectedShape = null,
            selectedShapes = new Set(),
            shapes = [],
            nextId = 1;
        let showGrid = true,
            showSeamAllowanceLines = true,
            showDimensions = true,
            snapEnabled = true;
        let gridSize = 50,
            polygonPoints = [],
            isDrawingPolygon = false;
        let hoveredHandle = null,
            isUpdatingInputs = false,
            dragStartPositions = new Map();
        let snapThreshold = 12;
        let dimLabelRects = [];
        const COTA_OFFSET = 30;
        const LINE_STYLES = {
            solid:  { dash: [],            label: 'Contínua',   mode: 'solid' },
            dashed: { dash: [8, 5],        label: 'Tracejada',  mode: 'dashed' },
            dotted: { dash: [2, 4],        label: 'Pontilhada', mode: 'dotted' },
            dashdot:{ dash: [10, 4, 2, 4], label: 'Traço-ponto',mode: 'dashdot' },
            draft:  { dash: [],            label: 'Rascunho',   mode: 'pencil' },
            pen:    { dash: [],            label: 'Caneta',     mode: 'pen' },
            chalk:  { dash: [],            label: 'Giz',        mode: 'chalk' },
            marker: { dash: [],            label: 'Marcador',   mode: 'marker' }
        };
        const PROJECT_STORAGE_KEY = 'sCADModel.autosave.v1';
        const SIDEBAR_STORAGE_KEY = 'sCADModel.sidebarSections.v1';
        let autoSaveTimer = null;
        let autoSaveSuspended = false;
        let clipboard = null,
            contextMenuShape = null;

        function initDragAndDrop() {
            const header = document.getElementById('mainHeader');
            const sections = header.querySelectorAll('.header-section');
            sections.forEach(section => {
                section.addEventListener('dragstart', (e) => {
                    section.classList.add('dragging');
                    e.dataTransfer.setData('text/plain', section.dataset.section);
                    e.dataTransfer.effectAllowed = 'move';
                });
                section.addEventListener('dragend', () => {
                    section.classList.remove('dragging');
                    header.querySelectorAll('.header-section').forEach(s => s.classList.remove('drag-over'));
                });
                section.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    e.dataTransfer.dropEffect = 'move';
                    const dragging = header.querySelector('.dragging');
                    if (dragging && dragging !== section) section.classList.add('drag-over');
                });
                section.addEventListener('dragleave', () => section.classList.remove('drag-over'));
                section.addEventListener('drop', (e) => {
                    e.preventDefault();
                    section.classList.remove('drag-over');
                    const dragging = header.querySelector('.dragging');
                    if (dragging && dragging !== section) {
                        const allSections = [...header.querySelectorAll('.header-section')];
                        const fromIndex = allSections.indexOf(dragging);
                        const toIndex = allSections.indexOf(section);
                        if (fromIndex < toIndex) section.after(dragging);
                        else section.before(dragging);
                    }
                });
            });
        }

        function positionTooltip(event, element) {
            const tooltipText = element.getAttribute('data-tooltip');
            if (!tooltipText) return;
            let tooltip = element._tooltipEl;
            if (!tooltip) {
                tooltip = document.createElement('div');
                tooltip.className = 'tooltip-dynamic';
                tooltip.style.cssText = `
                    position: fixed;
                    background: rgba(0,0,0,0.85);
                    color: white;
                    padding: 3px 8px;
                    border-radius: 4px;
                    font-size: 10px;
                    white-space: nowrap;
                    pointer-events: none;
                    z-index: 10001;
                    opacity: 0;
                    transition: opacity 0.15s;
                `;
                tooltip.textContent = tooltipText;
                document.body.appendChild(tooltip);
                element._tooltipEl = tooltip;
                element._arrowEl = document.createElement('div');
                element._arrowEl.style.cssText = `
                    position: fixed;
                    pointer-events: none;
                    z-index: 10001;
                    border: 5px solid transparent;
                    opacity: 0;
                    transition: opacity 0.15s;
                `;
                document.body.appendChild(element._arrowEl);
            }
            const rect = element.getBoundingClientRect();
            const tooltipWidth = tooltip.offsetWidth;
            const tooltipHeight = tooltip.offsetHeight;
            const windowWidth = window.innerWidth;
            const windowHeight = window.innerHeight;
            const margin = 6;
            const positions = [
                { name: 'top', x: rect.left + rect.width / 2 - tooltipWidth / 2, y: rect.top - tooltipHeight - 6, arrow: 'bottom', ax: rect.left + rect.width / 2, ay: rect.top - 1 },
                { name: 'bottom', x: rect.left + rect.width / 2 - tooltipWidth / 2, y: rect.bottom + 6, arrow: 'top', ax: rect.left + rect.width / 2, ay: rect.bottom + 1 },
                { name: 'left', x: rect.left - tooltipWidth - 6, y: rect.top + rect.height / 2 - tooltipHeight / 2, arrow: 'right', ax: rect.left - 1, ay: rect.top + rect.height / 2 },
                { name: 'right', x: rect.right + 6, y: rect.top + rect.height / 2 - tooltipHeight / 2, arrow: 'left', ax: rect.right + 1, ay: rect.top + rect.height / 2 },
            ];
            let bestPos = positions[0];
            for (const pos of positions) {
                const fitsX = pos.x >= margin && pos.x + tooltipWidth <= windowWidth - margin;
                const fitsY = pos.y >= margin && pos.y + tooltipHeight <= windowHeight - margin;
                if (fitsX && fitsY) { bestPos = pos; break; }
            }
            if (bestPos === positions[0]) {
                let minOverflow = Infinity;
                for (const pos of positions) {
                    const overflowX = Math.max(0, margin - pos.x) + Math.max(0, pos.x + tooltipWidth - (windowWidth - margin));
                    const overflowY = Math.max(0, margin - pos.y) + Math.max(0, pos.y + tooltipHeight - (windowHeight - margin));
                    const totalOverflow = overflowX + overflowY;
                    if (totalOverflow < minOverflow) { minOverflow = totalOverflow; bestPos = pos; }
                }
            }
            tooltip.style.left = Math.max(margin, Math.min(bestPos.x, windowWidth - tooltipWidth - margin)) + 'px';
            tooltip.style.top = Math.max(margin, Math.min(bestPos.y, windowHeight - tooltipHeight - margin)) + 'px';
            tooltip.style.opacity = '1';
            const arrow = element._arrowEl;
            const arrowSize = 5;
            let arrowX = bestPos.ax;
            let arrowY = bestPos.ay;
            arrowX = Math.max(margin + arrowSize, Math.min(arrowX, windowWidth - margin - arrowSize));
            arrowY = Math.max(margin + arrowSize, Math.min(arrowY, windowHeight - margin - arrowSize));
            arrow.style.left = arrowX + 'px';
            arrow.style.top = arrowY + 'px';
            arrow.style.borderTopColor = 'transparent';
            arrow.style.borderBottomColor = 'transparent';
            arrow.style.borderLeftColor = 'transparent';
            arrow.style.borderRightColor = 'transparent';
            if (bestPos.arrow === 'top') arrow.style.borderTopColor = 'rgba(0,0,0,0.85)';
            if (bestPos.arrow === 'bottom') arrow.style.borderBottomColor = 'rgba(0,0,0,0.85)';
            if (bestPos.arrow === 'left') arrow.style.borderLeftColor = 'rgba(0,0,0,0.85)';
            if (bestPos.arrow === 'right') arrow.style.borderRightColor = 'rgba(0,0,0,0.85)';
            arrow.style.opacity = '1';
        }

        function hideTooltip(element) {
            if (element._tooltipEl) { element._tooltipEl.style.opacity = '0'; element._arrowEl.style.opacity = '0'; }
        }

        function initSmartTooltips() {
            document.querySelectorAll('[data-tooltip]').forEach(btn => {
                btn.addEventListener('mouseenter', (e) => positionTooltip(e, btn));
                btn.addEventListener('mouseleave', () => hideTooltip(btn));
                btn.addEventListener('mousemove', (e) => positionTooltip(e, btn));
            });
        }

        function cleanupTooltips() {
            document.querySelectorAll('[data-tooltip]').forEach(btn => {
                if (btn._tooltipEl) { btn._tooltipEl.remove(); btn._arrowEl.remove(); btn._tooltipEl = null; btn._arrowEl = null; }
            });
        }

        function resizeCanvas() {
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            canvas.style.width = container.clientWidth + 'px';
            canvas.style.height = container.clientHeight + 'px';
            draw();
        }

        function rectsOverlap(a, b) {
            return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
        }

        function dimRectCollides(x, y, w, h) {
            const m = 4;
            for (const r of dimLabelRects) {
                if (rectsOverlap({ x: x - m, y: y - m, w: w + m * 2, h: h + m * 2 }, r)) return true;
            }
            return false;
        }

        function reserveDimRect(x, y, w, h) {
            dimLabelRects.push({ x: x, y: y, w: w, h: h });
        }

        class Shape {
            constructor(type, x, y, width, height, color = '#4A90E2', name = '') {
                this.id = nextId++;
                this.type = type;
                this.x = x;
                this.y = y;
                this.width = width;
                this.height = height;
                this.color = color;
                this.name = name || `${type}_${this.id}`;
                this.seamAllowance = parseFloat(document.getElementById('seamAllowance').value);
                this.visible = true;
                this.polygonPoints = [];
                this.joinedSides = { top: [], bottom: [], left: [], right: [] };
                this.positionEdited = false;
                this.lineStyle = 'solid';
                const lsEl = document.getElementById('lineStyle');
                if (lsEl && LINE_STYLES[lsEl.value]) this.lineStyle = lsEl.value;
                if (type === 'rectangle') {
                    this.polygonPoints = [{ x: 0, y: 0 }, { x: width, y: 0 }, { x: width, y: height }, { x: 0, y: height }];
                } else if (type === 'circle') {
                    const cx = width / 2, cy = height / 2, rx = width / 2, ry = height / 2, n = 32;
                    for (let i = 0; i < n; i++) { const a = (i / n) * Math.PI * 2; this.polygonPoints.push({ x: cx + Math.cos(a) * rx, y: cy + Math.sin(a) * ry }); }
                } else if (type === 'halfmoon') {
                    const cx = width / 2, cy = height, rx = width / 2, ry = height, n = 32;
                    for (let i = 0; i <= n; i++) { const a = Math.PI + (i / n) * Math.PI; this.polygonPoints.push({ x: cx + Math.cos(a) * rx, y: cy + Math.sin(a) * ry }); }
                } else if (type === 'line') {
                    this.polygonPoints = [{ x: 0, y: 0 }, { x: width, y: height }];
                }
            }

            clone(ox = 30, oy = 30) {
                const c = new Shape(this.type, this.x + ox, this.y + oy, this.width, this.height, this.color, this.name);
                c.polygonPoints = this.polygonPoints.map(p => ({ ...p }));
                c.seamAllowance = this.seamAllowance; c.visible = this.visible;
                c.joinedSides = JSON.parse(JSON.stringify(this.joinedSides));
                c.positionEdited = false;
                c.lineStyle = this.lineStyle;
                return c;
            }

            detectJoinedSides() {
                const tol = 2;
                this.joinedSides = { top: [], bottom: [], left: [], right: [] };
                for (const other of shapes) {
                    if (other === this || !other.visible) continue;
                    if (Math.abs(this.y - (other.y + other.height)) < tol) {
                        const ol = Math.max(this.x, other.x), or = Math.min(this.x + this.width, other.x + other.width);
                        if (or > ol) this.joinedSides.top.push({ start: ol - this.x, end: or - this.x, otherId: other.id });
                    }
                    if (Math.abs((this.y + this.height) - other.y) < tol) {
                        const ol = Math.max(this.x, other.x), or = Math.min(this.x + this.width, other.x + other.width);
                        if (or > ol) this.joinedSides.bottom.push({ start: ol - this.x, end: or - this.x, otherId: other.id });
                    }
                    if (Math.abs(this.x - (other.x + other.width)) < tol) {
                        const ot = Math.max(this.y, other.y), ob = Math.min(this.y + this.height, other.y + other.height);
                        if (ob > ot) this.joinedSides.left.push({ start: ot - this.y, end: ob - this.y, otherId: other.id });
                    }
                    if (Math.abs((this.x + this.width) - other.x) < tol) {
                        const ot = Math.max(this.y, other.y), ob = Math.min(this.y + this.height, other.y + other.height);
                        if (ob > ot) this.joinedSides.right.push({ start: ot - this.y, end: ob - this.y, otherId: other.id });
                    }
                }
            }

            mergeIntervals(intervals) {
                if (intervals.length === 0) return [];
                const sorted = [...intervals].sort((a, b) => a.start - b.start);
                const merged = [{ ...sorted[0] }];
                for (let i = 1; i < sorted.length; i++) {
                    const last = merged[merged.length - 1];
                    if (sorted[i].start <= last.end + 1) last.end = Math.max(last.end, sorted[i].end);
                    else merged.push({ ...sorted[i] });
                }
                return merged;
            }

            getDimensionBounds() {
                if (!this.polygonPoints || this.polygonPoints.length === 0) {
                    return { x: this.x, y: this.y, width: this.width, height: this.height };
                }
                let mx = Infinity, my = Infinity, Mx = -Infinity, My = -Infinity;
                this.polygonPoints.forEach(p => {
                    mx = Math.min(mx, p.x);
                    my = Math.min(my, p.y);
                    Mx = Math.max(Mx, p.x);
                    My = Math.max(My, p.y);
                });
                return {
                    x: this.x + mx,
                    y: this.y + my,
                    width: Mx - mx,
                    height: My - my
                };
            }

            // CORREÇÃO PRINCIPAL: Função getFreeSegments agora considera 
            // apenas peças com o mesmo perfil (sameProfile) para remoção de cotas duplicadas
            getAllBlockedSegments(side, totalSize, bounds = null) {
                const bx = bounds ? bounds.x : this.x;
                const by = bounds ? bounds.y : this.y;
                const bw = bounds ? bounds.width : this.width;
                const bh = bounds ? bounds.height : this.height;
                const blocked = [];

                // Função para verificar se outra peça está no mesmo lado e mesmo perfil
                const isSameSideAndProfile = (other) => {
                    if (other === this || !other.visible) return false;
                    
                    // Verifica se está no mesmo lado
                    let sameSide = false;
                    const sidePos = {
                        'bottom': by + bh,
                        'top': by,
                        'right': bx + bw,
                        'left': bx
                    };
                    
                    const otherPos = {
                        'bottom': other.y + other.height,
                        'top': other.y,
                        'right': other.x + other.width,
                        'left': other.x
                    };
                    
                    const tolerance = 2;
                    const pos = sidePos[side];
                    const otherPosVal = otherPos[side];
                    
                    if (Math.abs(pos - otherPosVal) < tolerance) {
                        // Verifica sobreposição na dimensão perpendicular
                        if (side === 'bottom' || side === 'top') {
                            const overlapX = Math.max(0, Math.min(this.x + this.width, other.x + other.width) - Math.max(this.x, other.x));
                            if (overlapX > 1) sameSide = true;
                        } else {
                            const overlapY = Math.max(0, Math.min(this.y + this.height, other.y + other.height) - Math.max(this.y, other.y));
                            if (overlapY > 1) sameSide = true;
                        }
                    }
                    
                    if (!sameSide) return false;
                    
                    // Verifica se tem o mesmo perfil (mesma largura e altura)
                    const thisW = (this.width / gridSize * 10).toFixed(1);
                    const thisH = (this.height / gridSize * 10).toFixed(1);
                    const otherW = (other.width / gridSize * 10).toFixed(1);
                    const otherH = (other.height / gridSize * 10).toFixed(1);
                    
                    return thisW === otherW && thisH === otherH;
                };

                // Primeiro, coleta todas as peças que estão no mesmo lado
                const sameSideShapes = [];
                for (const other of shapes) {
                    if (other === this || !other.visible) continue;
                    if (isSameSideAndProfile(other)) {
                        sameSideShapes.push(other);
                    }
                }

                // Se encontrar peças com mesmo perfil no mesmo lado, BLOQUEIA TOTALMENTE
                // para não mostrar cotas duplicadas
                if (sameSideShapes.length > 0) {
                    // Bloqueia todo o segmento para evitar cotas duplicadas
                    blocked.push({ start: 0, end: totalSize });
                    return this.mergeIntervals(blocked);
                }

                // Caso contrário, comportamento normal de bloqueio
                for (const other of shapes) {
                    if (other === this || !other.visible) continue;
                    let segStart = -1, segEnd = -1;
                    if (side === 'bottom') {
                        const cy = by + bh + COTA_OFFSET;
                        if (cy >= other.y - 2 && cy <= other.y + other.height + 2) {
                            segStart = Math.max(0, other.x - bx);
                            segEnd = Math.min(totalSize, other.x + other.width - bx);
                        }
                    } else if (side === 'top') {
                        const cy = by - COTA_OFFSET;
                        if (cy >= other.y - 2 && cy <= other.y + other.height + 2) {
                            segStart = Math.max(0, other.x - bx);
                            segEnd = Math.min(totalSize, other.x + other.width - bx);
                        }
                    } else if (side === 'right') {
                        const cx = bx + bw + COTA_OFFSET;
                        if (cx >= other.x - 2 && cx <= other.x + other.width + 2) {
                            segStart = Math.max(0, other.y - by);
                            segEnd = Math.min(totalSize, other.y + other.height - by);
                        }
                    } else if (side === 'left') {
                        const cx = bx - COTA_OFFSET;
                        if (cx >= other.x - 2 && cx <= other.x + other.width + 2) {
                            segStart = Math.max(0, other.y - by);
                            segEnd = Math.min(totalSize, other.y + other.height - by);
                        }
                    }
                    if (segEnd > segStart && segStart >= 0) blocked.push({ start: segStart, end: segEnd });
                }
                const joined = this.joinedSides[side] || [];
                for (const j of joined) blocked.push({ start: j.start, end: j.end });
                return this.mergeIntervals(blocked);
            }

            getFreeSegments(side, totalSize, bounds = null) {
                const blocked = this.getAllBlockedSegments(side, totalSize, bounds);
                if (blocked.length === 0) return [{ start: 0, end: totalSize }];
                const free = [];
                let pos = 0;
                for (const b of blocked) {
                    if (b.start > pos + 0.5) free.push({ start: pos, end: b.start });
                    pos = Math.max(pos, b.end);
                }
                if (pos < totalSize - 0.5) free.push({ start: pos, end: totalSize });
                return free;
            }

            getAllSnapPoints() {
                const pts = [];
                pts.push({ x: this.x, y: this.y });
                pts.push({ x: this.x + this.width, y: this.y });
                pts.push({ x: this.x + this.width, y: this.y + this.height });
                pts.push({ x: this.x, y: this.y + this.height });
                pts.push({ x: this.x + this.width / 2, y: this.y });
                pts.push({ x: this.x + this.width, y: this.y + this.height / 2 });
                pts.push({ x: this.x + this.width / 2, y: this.y + this.height });
                pts.push({ x: this.x, y: this.y + this.height / 2 });
                return pts;
            }

            getHandlePositions() { return this.polygonPoints.map((p, i) => ({ x: this.x + p.x, y: this.y + p.y, type: 'point', index: i })); }
            getHandleAt(x, y) { for (const h of this.getHandlePositions()) { const hx = (h.x + offsetX) * zoom, hy = (h.y + offsetY) * zoom; if (Math.sqrt((x - hx) ** 2 + (y - hy) ** 2) < 8) return h; } return null; }
            resize(h, dx, dy) { if (h.index !== undefined && this.polygonPoints[h.index]) { const pt = this.polygonPoints[h.index]; pt.x += dx; pt.y += dy; this.recalcBounds(); updateAllJoinedSides(); updateInputsFromShape(); } }
            recalcBounds() { if (!this.polygonPoints.length) return; let mx = Infinity, my = Infinity, Mx = -Infinity, My = -Infinity; this.polygonPoints.forEach(p => { mx = Math.min(mx, p.x); my = Math.min(my, p.y); Mx = Math.max(Mx, p.x); My = Math.max(My, p.y); }); this.width = Mx - mx; this.height = My - my; }
            addPoint(wx, wy) {
                const lx = wx - this.x, ly = wy - this.y;
                let bi = 0, bd = Infinity, bestPt = null;
                const addThreshold = 12 / Math.max(zoom, 0.1);
                for (let i = 0; i < this.polygonPoints.length; i++) {
                    const j = (i + 1) % this.polygonPoints.length;
                    const p = this.projectToSeg(lx, ly, this.polygonPoints[i].x, this.polygonPoints[i].y, this.polygonPoints[j].x, this.polygonPoints[j].y);
                    if (p.dist < bd) { bd = p.dist; bi = j; bestPt = p; }
                }
                if (!bestPt || bd > addThreshold) return false;
                const p1 = this.polygonPoints[(bi - 1 + this.polygonPoints.length) % this.polygonPoints.length];
                const p2 = this.polygonPoints[bi % this.polygonPoints.length];
                this.polygonPoints.splice(bi, 0, { x: bestPt.x, y: bestPt.y });
                this.type = 'polygon';
                this.recalcBounds();
                updateAllJoinedSides();
                updateInputsFromShape();
                return true;
            }
            updateDimsOnly() { if (!this.polygonPoints.length) return; let mx = Infinity, my = Infinity, Mx = -Infinity, My = -Infinity; this.polygonPoints.forEach(p => { mx = Math.min(mx, p.x); my = Math.min(my, p.y); Mx = Math.max(Mx, p.x); My = Math.max(My, p.y); }); this.width = Mx - mx; this.height = My - my; }
            removePoint(i) { if (this.polygonPoints.length > 3) { this.polygonPoints.splice(i, 1); this.recalcBounds(); updateAllJoinedSides(); updateInputsFromShape(); } }
            snapPointOnEdit(i, x, y) {
                const pts = this.polygonPoints;
                if (pts.length < 2) return { x, y };
                const snapDist = snapThreshold / Math.max(zoom, 0.1);
                let sx = x, sy = y;

                const candidates = [];
                const prev = pts[(i - 1 + pts.length) % pts.length];
                const next = pts[(i + 1) % pts.length];
                if (prev) {
                    candidates.push({ type: 'y', value: prev.y });
                    candidates.push({ type: 'x', value: prev.x });
                }
                if (next) {
                    candidates.push({ type: 'y', value: next.y });
                    candidates.push({ type: 'x', value: next.x });
                }

                let bestDx = null, bestDy = null;
                let bestAbsDx = Infinity, bestAbsDy = Infinity;
                for (const c of candidates) {
                    if (c.type === 'x') {
                        const d = Math.abs(x - c.value);
                        if (d < bestAbsDx && d <= snapDist) { bestAbsDx = d; bestDx = c.value; }
                    } else {
                        const d = Math.abs(y - c.value);
                        if (d < bestAbsDy && d <= snapDist) { bestAbsDy = d; bestDy = c.value; }
                    }
                }

                if (bestDx !== null) sx = bestDx;
                if (bestDy !== null) sy = bestDy;

                if (bestDx === null && bestDy === null && pts.length >= 3) {
                    const prev2 = pts[(i - 2 + pts.length) % pts.length];
                    const next2 = pts[(i + 2) % pts.length];
                    if (prev2 && next2) {
                        const p = this.projectToSeg(sx, sy, prev2.x, prev2.y, next2.x, next2.y);
                        if (p.dist <= snapDist) return { x: p.x, y: p.y };
                    }
                }

                return { x: sx, y: sy };
            }

        function zoomOut() { const cx = canvas.width / 2, cy = canvas.height / 2, nz = zoom / 1.2; if (nz >= 0.1) { offsetX = cx / nz - (cx / zoom - offsetX); offsetY = cy / nz - (cy / zoom - offsetY); zoom = nz; draw(); } }
        function resetZoom() { zoom = 1; offsetX = 0; offsetY = 0; draw(); }
        function fitAll() { if (!shapes.length) return; let mx = Infinity, my = Infinity, Mx = -Infinity, My = -Infinity; shapes.forEach(s => { mx = Math.min(mx, s.x); my = Math.min(my, s.y); Mx = Math.max(Mx, s.x + s.width); My = Math.max(My, s.y + s.height); }); const p = 100, sw = Mx - mx + p * 2, sh = My - my + p * 2; zoom = Math.min(canvas.width / sw, canvas.height / sh); offsetX = -mx + p + (canvas.width / zoom - sw) / 2; offsetY = -my + p + (canvas.height / zoom - sh) / 2; draw(); }
        function toggleGrid() { showGrid = document.getElementById('showGrid').checked; draw(); }
        function toggleSeamAllowance() { showSeamAllowanceLines = document.getElementById('showSeamAllowance').checked; draw(); }
        function toggleSnapEnabled() { snapEnabled = document.getElementById('snapEnabled').checked; }
        function toggleDimensions() { showDimensions = document.getElementById('showDimensions').checked; draw(); }
        function duplicateSelected() { if (!selectedShapes.size) return; const ns = []; selectedShapes.forEach(s => { const n = s.clone(20, 20); n.id = nextId++; shapes.push(n); ns.push(n); }); selectedShapes.clear(); ns.forEach(s => selectedShapes.add(s)); selectedShape = ns[0]; updateAllJoinedSides(); updateLayersList(); updateInputsFromShape(); draw(); hideContextMenu(); }
        function deleteSelected() { if (!selectedShapes.size) return; shapes = shapes.filter(s => !selectedShapes.has(s)); selectedShapes.clear(); selectedShape = null; updateAllJoinedSides(); updateLayersList(); updateInputsFromShape(); draw(); hideContextMenu(); }
        function clearCanvas() { if (shapes.length && confirm('Limpar tudo?')) { shapes = []; selectedShape = null; selectedShapes.clear(); polygonPoints = []; isDrawingPolygon = false; clipboard = null; updateLayersList(); updateInputsFromShape(); draw(); scheduleAutoSave(); } }
function exportPattern() { if (!shapes.length) return; const ec = document.createElement('canvas'), ex = ec.getContext('2d'); let mx = Infinity, my = Infinity, Mx = -Infinity, My = -Infinity; shapes.forEach(s => { mx = Math.min(mx, s.x - 50); my = Math.min(my, s.y - 50); Mx = Math.max(Mx, s.x + s.width + 50); My = Math.max(My, s.y + s.height + 50); }); const p = 50; ec.width = Mx - mx + p * 2; ec.height = My - my + p * 2; ex.fillStyle = '#fff'; ex.fillRect(0, 0, ec.width, ec.height); const ox = -mx + p, oy = -my + p; shapes.forEach(s => { ex.save(); ex.translate(s.x + ox, s.y + oy); ex.fillStyle = s.color + '30'; if (s.polygonPoints.length > 1) { if (s.type !== 'line') { ex.beginPath(); ex.moveTo(s.polygonPoints[0].x, s.polygonPoints[0].y); for (let i = 1; i < s.polygonPoints.length; i++) ex.lineTo(s.polygonPoints[i].x, s.polygonPoints[i].y); ex.closePath(); ex.fill(); } s.strokePath(ex, false); } ex.fillStyle = '#000'; ex.font = '12px Arial'; ex.textAlign = 'center'; ex.fillText(s.name, s.width / 2, -10); ex.restore(); }); const a = document.createElement('a'); a.download = 'molde_' + new Date().toISOString().slice(0, 10) + '.png'; a.href = ec.toDataURL(); a.click(); }

        function exportJSON() {
            if (!shapes.length) { alert('Não há peças no projeto para exportar.'); return; }
            const projectData = buildProjectData();
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(projectData, null, 2));
            const a = document.createElement('a');
            a.setAttribute("href", dataStr);
            a.setAttribute("download", "projeto_molde_" + new Date().toISOString().slice(0, 10) + ".json");
            document.body.appendChild(a);
            a.click();
            a.remove();
            updateStatus('Projeto exportado em JSON com sucesso!');
        }

        function triggerImportJSON() { document.getElementById('importJsonFile').click(); }

        function importJSON(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    if (!data.shapes || !Array.isArray(data.shapes)) throw new Error('Arquivo JSON inválido.');
                    shapes = data.shapes.map(sd => {
                        const s = new Shape(sd.type, sd.x, sd.y, sd.width, sd.height, sd.color, sd.name);
                        s.id = sd.id; s.seamAllowance = sd.seamAllowance; s.visible = sd.visible;
                        s.polygonPoints = sanitizePolygonPoints(Array.isArray(sd.polygonPoints) ? sd.polygonPoints.map(p => ({ ...p })) : []);
                        s.joinedSides = sd.joinedSides || { top: [], bottom: [], left: [], right: [] };
                        s.lineStyle = LINE_STYLES[sd.lineStyle] ? sd.lineStyle : 'solid';
                        s.positionEdited = !!sd.positionEdited;
                        return s;
                    });
                    nextId = data.nextId ? data.nextId : Math.max(...shapes.map(s => s.id), 0) + 1;
                    selectedShape = null; selectedShapes.clear();
                    updateAllJoinedSides(); updateLayersList(); updateInputsFromShape(); draw();
                    saveProjectStateNow();
                    updateStatus('Projeto importado com sucesso!');
                } catch (err) { alert('Erro ao importar arquivo JSON: ' + err.message); }
                finally { event.target.value = ''; }
            };
            reader.readAsText(file);
        }

        function updateLayersList() { const ll = document.getElementById('layersList'); ll.innerHTML = ''; shapes.forEach((s, i) => { const d = document.createElement('div'); d.className = 'layer-item'; if (selectedShapes.has(s)) d.classList.add('selected'); const cs = document.createElement('span'); cs.className = 'layer-color'; cs.style.backgroundColor = s.color; const ns = document.createElement('span'); ns.className = 'layer-name'; ns.textContent = s.name; const ss = document.createElement('span'); ss.className = 'layer-size'; ss.textContent = `${(s.width/gridSize*10).toFixed(1)}x${(s.height/gridSize*10).toFixed(1)}cm`; const tb = document.createElement('button'); tb.className = 'layer-toggle'; tb.textContent = s.visible ? '👁️' : '👁️‍🗨️'; tb.onclick = e => { e.stopPropagation(); shapes[i].visible = !shapes[i].visible; updateAllJoinedSides(); updateLayersList(); draw(); }; d.appendChild(cs); d.appendChild(ns); d.appendChild(ss); d.appendChild(tb); d.onclick = e => { if (e.target !== tb) { if (e.ctrlKey) { if (selectedShapes.has(s)) selectedShapes.delete(s); else selectedShapes.add(s); } else { selectedShapes.clear(); selectedShapes.add(s); } selectedShape = s; updateLayersList(); updateInputsFromShape(); draw(); } }; ll.appendChild(d); }); }
        function updateStatus(msg) { document.getElementById('statusText').textContent = `${msg} | Peças: ${shapes.length} | Zoom: ${Math.round(zoom*100)}%`; }
        function drawGrid() { if (!showGrid) return; const g = gridSize * zoom, sx = (offsetX * zoom) % g, sy = (offsetY * zoom) % g; ctx.strokeStyle = '#f0f0f0'; ctx.lineWidth = 0.3; for (let x = sx; x < canvas.width; x += g / 10) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke(); } for (let y = sy; y < canvas.height; y += g / 10) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke(); } ctx.strokeStyle = '#ddd'; ctx.lineWidth = 0.8; for (let x = sx; x < canvas.width; x += g) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke(); } for (let y = sy; y < canvas.height; y += g) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke(); } }
        function drawAxes() { const ax = canvas.width - 80, ay = 60, al = 40; ctx.save(); ctx.strokeStyle = '#333'; ctx.fillStyle = '#333'; ctx.lineWidth = 1.5; ctx.font = 'bold 11px Arial'; ctx.beginPath(); ctx.moveTo(ax - al, ay); ctx.lineTo(ax + al, ay); ctx.moveTo(ax + al - 6, ay - 4); ctx.lineTo(ax + al, ay); ctx.lineTo(ax + al - 6, ay + 4); ctx.stroke(); ctx.fillText('X', ax + al + 2, ay + 5); ctx.beginPath(); ctx.moveTo(ax, ay + al); ctx.lineTo(ax, ay - al); ctx.moveTo(ax - 4, ay - al + 6); ctx.lineTo(ax, ay - al); ctx.lineTo(ax + 4, ay - al + 6); ctx.stroke(); ctx.fillText('Y', ax + 5, ay - al - 2); ctx.restore(); }
        function draw() { ctx.clearRect(0, 0, canvas.width, canvas.height); dimLabelRects = []; drawGrid(); shapes.forEach(s => { s.draw(ctx, zoom, offsetX, offsetY); s.drawDims(ctx, zoom, offsetX, offsetY); }); drawAxes(); }
        function init() {
            resizeCanvas();
            initSidebarSections();
            const restored = loadProjectState();
            if (!restored) { updateLayersList(); updateInputsFromShape(); draw(); }
            setTool('select');
            initSmartTooltips(); initDragAndDrop();
        }
        window.addEventListener('resize', () => { resizeCanvas(); cleanupTooltips(); initSmartTooltips(); });
        document.addEventListener('keydown', e => { if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return; if (e.ctrlKey && e.key === 'c') { e.preventDefault(); copyShape(); } else if (e.ctrlKey && e.key === 'v') { e.preventDefault(); pasteShape(); } else if (e.ctrlKey && e.key === 'd') { e.preventDefault(); duplicateSelected(); } else if (e.key === 'Delete' || e.key === 'Backspace') deleteSelected(); else if (e.ctrlKey && e.key === 'a') { e.preventDefault(); selectedShapes.clear(); shapes.forEach(s => selectedShapes.add(s)); if (shapes.length) selectedShape = shapes[0]; updateLayersList(); updateInputsFromShape(); draw(); } else if (e.ctrlKey && e.key === 'z') { e.preventDefault(); if (shapes.length) { shapes.pop(); selectedShapes.clear(); selectedShape = shapes.length ? shapes[shapes.length - 1] : null; if (selectedShape) selectedShapes.add(selectedShape); updateAllJoinedSides(); updateLayersList(); updateInputsFromShape(); draw(); } } else if (e.key === 'Escape') { hideContextMenu(); selectedShape = null; selectedShapes.clear(); updateLayersList(); updateInputsFromShape(); draw(); } else if (e.key === '1') setTool('select'); else if (e.key === '7') setTool('editPoints'); else if (e.ctrlKey && e.key === 'f') { e.preventDefault(); fitAll(); } });
        container.addEventListener('wheel', e => e.preventDefault(), { passive: false });
        container.addEventListener('contextmenu', e => e.preventDefault());
        init();
    </script>
